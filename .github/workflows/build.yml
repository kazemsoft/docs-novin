name: Build docs

# GitHub only gates PRs and main. The release path lives in .gitlab-ci.yml:
# a version tag on the GitLab remote builds the image, pushes it to the
# internal registry and updates the gitops repo. See DEPLOYMENT.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # onBrokenLinks: "throw" makes this fail on any dead internal link.
      - run: npm run build
