# Unprivileged nginx: listens on 8080 so the container needs no root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Build the trailing-slash redirect from the Host/scheme Kong forwards,
    # not from nginx's own :8080 — otherwise users are sent to a dead port.
    absolute_redirect off;
    port_in_redirect off;

    # Hashed assets are immutable; HTML must revalidate so edits go live.
    location ~* ^/(en/)?assets/.*\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The en locale is self-contained and emits its own 404 page. Declared
    # before / so it wins for /en/* — nginx prefers the longest prefix.
    location /en/ {
        try_files $uri $uri/ $uri/index.html @en_notfound;
    }

    # Docusaurus emits a directory per route, each with its own index.html.
    location / {
        try_files $uri $uri/ $uri/index.html @fa_notfound;
    }

    # Named fallbacks, not `try_files ... /404.html`: serving the file
    # directly from try_files returns 200, which tells crawlers the missing
    # page exists. These return a real 404 with the styled page as the body.
    # error_page is scoped per fallback so each locale gets its own page;
    # a single server-level error_page would serve Persian for /en/ misses.
    location @fa_notfound {
        error_page 404 /404.html;
        return 404;
    }
    location @en_notfound {
        error_page 404 /en/404.html;
        return 404;
    }

    location = /404.html {
        internal;
    }
    location = /en/404.html {
        internal;
    }
}
