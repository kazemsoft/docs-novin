server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets are immutable; HTML must revalidate so edits go live.
    location ~* ^/assets/.*\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docusaurus emits a directory per route, each with its own index.html.
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    error_page 404 /404.html;
}
