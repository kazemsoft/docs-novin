server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets are immutable; HTML must revalidate so edits go live.
    location ~* ^/docs/assets/.*\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /docs {
        return 301 /docs/;
    }
}
